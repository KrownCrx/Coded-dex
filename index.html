<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBTSL</title>
<link rel="icon" type="image/png" href="bbtsl-logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <div class="brand">BBTSL <small>v1.0</small></div>
  <button class="navlink active" data-page="list">List</button>
  <button class="navlink" data-page="leaderboard">Leaderboard</button>
  <button class="navlink" data-page="roulette">Roulette</button>
  <div class="nav-spacer"></div>
  <button class="theme-toggle" id="themeToggle" title="Đổi nền sáng/tối">◐</button>
  <button class="admin-open" id="adminOpen">Admin</button>
  <button class="submit" data-page="submit">Submit Record</button>
</header>

<div id="app"></div>

<div class="modal hidden" id="adminModal">
  <div class="modal-box">
    <button class="close" id="closeAdmin">×</button>
    <h2>BBTSL Admin</h2>
    <p class="muted">Chỉ tài khoản chủ sở hữu mới được phép chỉnh sửa dữ liệu.</p>
    <label>Admin Password</label>
    <input id="adminPassword" type="password" placeholder="Admin Password">
    <button class="primary" id="adminLogin">Login</button>

    <div id="adminPanel" class="hidden">
      <hr>
      <h3>Edit level</h3>
      <select id="levelSelect"></select>
      <input id="editName" placeholder="Level name">
      <input id="editCreator" placeholder="Creator">
      <input id="editVerifier" placeholder="Verifier">
      <input id="editPublisher" placeholder="Publisher">
      <input id="editPoints" placeholder="Points">
      <input id="editId" placeholder="Level ID">
      <input id="editPassword" placeholder="Password">
      <input id="editQualify" placeholder="Qualify %">
      <input id="editVideo" placeholder="YouTube URL">
      <button class="primary" id="saveLevel">Save level</button>
      <button class="danger" id="clearLevel">Clear level</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
